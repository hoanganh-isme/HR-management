name: hr-management

services:
  backend-app:
    build:
      context: ./backend-app
      dockerfile: Dockerfile
    container_name: backend_app
    environment:
      NODE_ENV: production
      PORT: 8081
      SQL_API_BASE: ${SQL_API_BASE:?Khai bao SQL_API_BASE trong .env.production}
      SQL_API_USER: ${SQL_API_USER:-}
      SQL_SERVER: ${SQL_SERVER:?Khai bao SQL_SERVER trong .env.production}
      SQL_PORT: ${SQL_PORT:-1433}
      SQL_DATABASE: ${SQL_DATABASE:?Khai bao SQL_DATABASE trong .env.production}
      SQL_USER: ${SQL_USER:?Khai bao SQL_USER trong .env.production}
      SQL_PASSWORD: ${SQL_PASSWORD:?Khai bao SQL_PASSWORD trong .env.production}
      SQL_ENCRYPT: ${SQL_ENCRYPT:-true}
      SQL_TRUST_SERVER_CERTIFICATE: ${SQL_TRUST_SERVER_CERTIFICATE:-false}
      SQL_POOL_MAX: ${SQL_POOL_MAX:-10}
      SQL_CONNECT_TIMEOUT_MS: ${SQL_CONNECT_TIMEOUT_MS:-15000}
      SQL_REQUEST_TIMEOUT_MS: ${SQL_REQUEST_TIMEOUT_MS:-300000}
      EXCEL_IMPORT_ENABLED: ${EXCEL_IMPORT_ENABLED:-true}
      EXCEL_IMPORT_ALLOWED_GROUP: ${EXCEL_IMPORT_ALLOWED_GROUP:-Admin}
      EXCEL_IMPORT_TEMP_DIR: ${EXCEL_IMPORT_TEMP_DIR:-}
      EXCEL_IMPORT_MAX_FILE_MB: ${EXCEL_IMPORT_MAX_FILE_MB:-25}
      EXCEL_IMPORT_MAX_ROWS: ${EXCEL_IMPORT_MAX_ROWS:-200000}
      EXCEL_IMPORT_PREVIEW_ROWS: ${EXCEL_IMPORT_PREVIEW_ROWS:-20}
      EXCEL_IMPORT_BATCH_SIZE: ${EXCEL_IMPORT_BATCH_SIZE:-10000}
      EXCEL_IMPORT_TIMEOUT_MS: ${EXCEL_IMPORT_TIMEOUT_MS:-300000}
      EXCEL_IMPORT_TTL_MINUTES: ${EXCEL_IMPORT_TTL_MINUTES:-30}
      EXCEL_IMPORT_MAX_ERRORS: ${EXCEL_IMPORT_MAX_ERRORS:-200}
      EXCEL_IMPORT_MAX_UNCOMPRESSED_MB: ${EXCEL_IMPORT_MAX_UNCOMPRESSED_MB:-500}
      EXCEL_IMPORT_MAX_COLUMNS: ${EXCEL_IMPORT_MAX_COLUMNS:-256}
      EXCEL_IMPORT_MAX_HEADER_ROW: ${EXCEL_IMPORT_MAX_HEADER_ROW:-20}
      EXCEL_IMPORT_MAX_SHEETS: ${EXCEL_IMPORT_MAX_SHEETS:-50}
      EXCEL_IMPORT_MAX_PENDING_PER_USER: ${EXCEL_IMPORT_MAX_PENDING_PER_USER:-3}
      EXCEL_IMPORT_MAX_CONCURRENT: ${EXCEL_IMPORT_MAX_CONCURRENT:-2}
      DOCUMENT_PUBLIC_BASE_URL: ${DOCUMENT_PUBLIC_BASE_URL:?Khai bao DOCUMENT_PUBLIC_BASE_URL trong .env.production}
      DOCUMENT_INTERNAL_BASE_URL: ${DOCUMENT_INTERNAL_BASE_URL:-http://backend-app:8081}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:?Khai bao ONLYOFFICE_PUBLIC_URL trong .env.production}
      ONLYOFFICE_JWT_ENABLED: "true"
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Khai bao ONLYOFFICE_JWT_SECRET trong .env.production}
      DRAFT_SIGNING_SECRET: ${DRAFT_SIGNING_SECRET:?Khai bao DRAFT_SIGNING_SECRET trong .env.production}
      DRAFT_TTL_HOURS: ${DRAFT_TTL_HOURS:-24}
      MAX_DOCX_SIZE_MB: ${MAX_DOCX_SIZE_MB:-20}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Khai bao CORS_ALLOWED_ORIGINS trong .env.production}
    ports:
      - "127.0.0.1:8083:8081"
    volumes:
      - ./backend-app/storage:/app/storage
      - ./backend-app/samples:/app/samples
      - ./backend-app/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - hrm-network

  onlyoffice:
    image: onlyoffice/documentserver:9.3.1.2
    container_name: onlyoffice_server
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Khai bao ONLYOFFICE_JWT_SECRET trong .env.production}
      # Backend nằm trong private Docker network. Chỉ bật cho network HR cô lập.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - onlyoffice_document_logs:/var/log/onlyoffice
      - onlyoffice_document_data:/var/www/onlyoffice/Data
      - onlyoffice_document_lib:/var/lib/onlyoffice
    restart: unless-stopped
    networks:
      - hrm-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend-app
      - onlyoffice
    restart: unless-stopped
    networks:
      - hrm-network

networks:
  hrm-network:
    name: hrm-network

volumes:
  onlyoffice_document_logs:
  onlyoffice_document_data:
  onlyoffice_document_lib:
